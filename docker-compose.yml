services:
  fetcher:
    build: .
    container_name: fetcher-gateway
    restart: unless-stopped
    # Режим host позволяет контейнеру использовать сеть хост-машины напрямую.
    # Любой новый выделенный порт (5001, 6565 и т.д.) сразу доступен по IP хоста (например, http://10.100.200.27:6565).
    network_mode: host

    # Если network_mode: host не поддерживается вашей платформой (например, на Mac/Windows Docker Desktop),
    # закомментируйте 'network_mode: host' выше и раскомментируйте блок ports ниже:
    # ports:
    #   - "4000:4000"
    #   - "5000-5100:5000-5100"

    volumes:
      # Сохранение конфигурации между перезапусками контейнера
      - ./fetcher-config.json:/app/fetcher-config.json
